# Telegraf configuration for mod_wsgi status monitoring
#
# Add this to your telegraf.conf or place in /etc/telegraf/telegraf.d/
#

[[inputs.exec]]
  ## Commands to run
  commands = ["/path/to/wsgi_status_telegraf.sh"]
  
  ## Timeout for each command to complete
  timeout = "5s"
  
  ## Measurement name suffix (optional)
  # name_suffix = ""
  
  ## Data format - the script outputs InfluxDB line protocol
  data_format = "influx"
  
  ## Interval to run the script (optional, uses agent interval if not set)
  # interval = "10s"

  ## Environment variables (optional)
  # environment = [
  #   "WSGI_STATUS_URL=http://localhost/wsgi-status",
  #   "WSGI_STATUS_HOST=myserver"
  # ]

# Example InfluxDB output configuration
# [[outputs.influxdb_v2]]
#   urls = ["http://localhost:8086"]
#   token = "your-token"
#   organization = "your-org"
#   bucket = "your-bucket"

# Metrics produced:
#
# 1. wsgi_status - Overall status summary
#    Tags: host
#    Fields: active_requests (int), processing (int), queued (int), error (int)
#
# 2. wsgi_request - Individual active request details  
#    Tags: host, pool, worker_id, thread_id, pid, method, status
#    Fields: duration (float), start_time (float)
#
# 3. wsgi_pool - Per-pool aggregated metrics
#    Tags: host, pool
#    Fields: active_requests (int), processing (int), queued (int)
#
# Example Grafana queries:
#
# Active requests over time:
#   SELECT mean("active_requests") FROM "wsgi_status" WHERE $timeFilter GROUP BY time($interval), "host"
#
# Requests by pool:
#   SELECT mean("active_requests") FROM "wsgi_pool" WHERE $timeFilter GROUP BY time($interval), "pool"
#
# Long-running requests (duration > 10s):
#   SELECT "duration", "uri" FROM "wsgi_request" WHERE "duration" > 10 AND $timeFilter
#
# Request count by method:
#   SELECT count("duration") FROM "wsgi_request" WHERE $timeFilter GROUP BY "method"

